name: Build BlasterZone IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Patch Revenge IPA with BlasterZone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Revenge IPA
        run: |
          curl -L "https://github.com/revenge-mod/revenge-tweak/releases/download/v250.0/Revenge.ipa" \
            -o Revenge.ipa
          ls -lh Revenge.ipa

      - name: Inject BlasterZone into Revenge IPA
        run: |
          # Extract
          mkdir -p work
          unzip -q Revenge.ipa -d work

          APP="work/Payload/Discord.app"
          PATCHES="$APP/RevengePatches.bundle"

          # Create preloads directory (dylib supports this natively)
          mkdir -p "$PATCHES/preloads"

          # Copy BlasterZone plugin as preload
          cp revenge-plugin/src/index.js "$PATCHES/preloads/blasterzone.js"

          echo "BlasterZone injected into preloads"
          ls "$PATCHES/preloads/"

          # Repack
          cd work
          zip -r -q ../BlasterZone.ipa Payload/
          cd ..
          ls -lh BlasterZone.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BlasterZone-IPA
          path: BlasterZone.ipa
          retention-days: 30
