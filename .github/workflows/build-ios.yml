name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Patch system watchers
        run: |
          echo vm.max_map_count=262144 | sudo tee -a /etc/sysctl.conf
          echo fs.inotify.max_user_watches=655360 | sudo tee -a /etc/sysctl.conf
          echo fs.inotify.max_user_instances=1280 | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p

      - name: Build iOS simulator (no Apple credentials needed)
        run: eas build --platform ios --profile simulator --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Done
        run: echo "Build submitted! Check https://expo.dev/accounts/blaster-1s-team/projects/67/builds"
